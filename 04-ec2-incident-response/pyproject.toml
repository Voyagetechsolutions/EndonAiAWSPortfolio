[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "endon-forensics"
version = "0.1.0"
description = "Endon AI automated EC2 incident response and forensic evidence collection"
requires-python = ">=3.11"
dependencies = ["endon-core", "boto3>=1.35"]

[tool.setuptools.packages.find]
where = ["src"]
