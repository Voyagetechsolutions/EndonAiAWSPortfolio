# Workspace-level tooling for the Endon AI monorepo.
# Each component is its own installable package (see */pyproject.toml);
# this file only configures tests and linting across all of them.

[tool.pytest.ini_options]
addopts = "--import-mode=importlib -q"
testpaths = [
    "endon-core/tests",
    "01-threat-detection-response/tests",
    "02-iam-security-analyzer/tests",
    "03-security-posture-scanner/tests",
    "04-ec2-incident-response/tests",
    "05-data-protection-monitor/tests",
    "06-secure-landing-zone/tests",
    "07-github-oidc-cicd/tests",
    "08-security-operations-center/tests",
    "09-terraform-iac-scanner/tests",
    "10-kubernetes-security/tests",
    "11-azure-posture/tests",
    "tests",
]
pythonpath = [
    "endon-core/src",
    "endon-core/infrastructure",
    "01-threat-detection-response/src",
    "01-threat-detection-response/infrastructure",
    "01-threat-detection-response/tests",
    "02-iam-security-analyzer/src",
    "02-iam-security-analyzer/infrastructure",
    "02-iam-security-analyzer/tests",
    "03-security-posture-scanner/src",
    "03-security-posture-scanner/infrastructure",
    "03-security-posture-scanner/tests",
    "04-ec2-incident-response/src",
    "04-ec2-incident-response/infrastructure",
    "04-ec2-incident-response/tests",
    "05-data-protection-monitor/src",
    "05-data-protection-monitor/infrastructure",
    "05-data-protection-monitor/tests",
    "06-secure-landing-zone/src",
    "06-secure-landing-zone/infrastructure",
    "06-secure-landing-zone/tests",
    "07-github-oidc-cicd/src",
    "07-github-oidc-cicd/infrastructure",
    "07-github-oidc-cicd/tests",
    "08-security-operations-center/src",
    "08-security-operations-center/infrastructure",
    "08-security-operations-center/tests",
    "09-terraform-iac-scanner/src",
    "09-terraform-iac-scanner/tests",
    "10-kubernetes-security/src",
    "10-kubernetes-security/tests",
    "11-azure-posture/src",
    "11-azure-posture/tests",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["cdk.out", "build"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM"]
# Line length is handled by `ruff format`; the lint rule would only flag long strings.
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = [
    "endon_core",
    "endon_detection",
    "endon_iam_analyzer",
    "endon_posture",
    "endon_forensics",
    "endon_dataprotection",
    "endon_landingzone",
    "endon_pipeline",
    "endon_soc",
    "endon_tfscan",
    "endon_k8s",
    "endon_azure",
    "detection_testkit",
    "iam_testkit",
    "posture_testkit",
    "forensics_testkit",
    "dataprotection_testkit",
    "lambda_bundle",
    "platform_stack",
    "detection_stack",
    "iam_analyzer_stack",
    "posture_scanner_stack",
    "forensics_stack",
    "data_protection_stack",
    "landing_zone_stack",
    "pipeline_stack",
    "soc_stack",
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "S105", "S106"]
"tests/**" = ["S101"]
